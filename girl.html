<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcane Vanguard — animated</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0c11;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 14px;
        top: 14px;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #dbe4f3;
        background: rgba(0, 0, 0, 0.55);
        padding: 10px 13px;
        border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        white-space: pre;
      }
      #hud b {
        color: #7fd0ff;
      }
      #hud s {
        color: #8b97ab;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="hud">loading…</div>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

      const hud = document.getElementById('hud');
      const loader = new GLTFLoader();
      const load = (url) =>
        new Promise((res, rej) => loader.load(url, res, undefined, rej));

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x2a3346);
      scene.fog = new THREE.Fog(0x2a3346, 14, 42);

      const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);

      scene.add(new THREE.HemisphereLight(0xbcd6ff, 0x3b4250, 1.5));
      const key = new THREE.DirectionalLight(0xfff2df, 2.6);
      key.position.set(4, 8, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.near = 1;
      key.shadow.camera.far = 30;
      const d = 4;
      Object.assign(key.shadow.camera, { left: -d, right: d, top: d, bottom: -d });
      key.shadow.bias = -0.0012;
      key.shadow.normalBias = 0.02;
      scene.add(key);
      scene.add(key.target);

      const rim = new THREE.DirectionalLight(0x86b8ff, 1.3);
      rim.position.set(-5, 3, -6);
      scene.add(rim);

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(60, 64),
        new THREE.MeshStandardMaterial({ color: 0x53606f, roughness: 0.95, metalness: 0 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      function measureBox(root) {
        root.updateMatrixWorld(true);
        const box = new THREE.Box3();
        const v = new THREE.Vector3();
        root.traverse((o) => {
          let bb = null;
          if (o.isSkinnedMesh) {
            o.computeBoundingBox();
            bb = o.boundingBox;
          } else if (o.isMesh && o.geometry) {
            if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
            bb = o.geometry.boundingBox;
          }
          if (!bb || bb.isEmpty()) return;
          for (let i = 0; i < 8; i++) {
            v.set(
              i & 1 ? bb.max.x : bb.min.x,
              i & 2 ? bb.max.y : bb.min.y,
              i & 4 ? bb.max.z : bb.min.z,
            );
            box.expandByPoint(v.applyMatrix4(o.matrixWorld));
          }
        });
        return box;
      }

      function unitScale(root) {
        let hips = null;
        root.traverse((o) => {
          if (!hips && /hips/i.test(o.name)) hips = o;
        });
        if (!hips) return 1;
        for (const child of hips.children) {
          if (/spine/i.test(child.name)) {
            const len = child.position.length();
            if (len > 1e-6) return len;
          }
        }
        return 1;
      }

      function filterClip(clip, root) {
        const names = new Set();
        root.traverse((o) => names.add(o.name));
        const tracks = clip.tracks.filter((t) => names.has(t.name.split('.')[0]));
        return new THREE.AnimationClip(clip.name, clip.duration, tracks);
      }

      function rescalePositions(clip, factor) {
        if (Math.abs(factor - 1) < 1e-6) return clip;
        const c = clip.clone();
        for (const t of c.tracks) {
          if (!t.name.endsWith('.position')) continue;
          for (let i = 0; i < t.values.length; i++) t.values[i] *= factor;
        }
        return c;
      }

      const HEIGHT = 1.72;

      async function boot() {
        const her = await load('./assets/characters/her_rigged.glb');
        const model = her.scene;
        scene.add(model);

        let box = measureBox(model);
        const size = new THREE.Vector3();
        box.getSize(size);
        model.scale.setScalar(HEIGHT / size.y);
        model.updateMatrixWorld(true);

        box = measureBox(model);
        const c = new THREE.Vector3();
        box.getCenter(c);
        model.position.x -= c.x;
        model.position.z -= c.z;
        model.position.y -= box.min.y;

        model.traverse((o) => {
          if (o.isMesh) {
            o.castShadow = true;
            o.frustumCulled = false;
          }
        });

        const donor = await load('./assets/oss/Soldier.glb');
        const f = unitScale(model) / unitScale(donor.scene);
        const clips = {};
        for (const raw of donor.animations) {
          const n = raw.name.toLowerCase();
          const k = n.includes('idle')
            ? 'idle'
            : n.includes('walk')
              ? 'walk'
              : n.includes('run')
                ? 'run'
                : null;
          if (k && !clips[k]) clips[k] = rescalePositions(filterClip(raw, model), f);
        }

        const names = Object.keys(clips);
        if (names.length === 0) {
          hud.textContent = 'no clips found in donor';
          return;
        }

        const mixer = new THREE.AnimationMixer(model);
        const actions = {};
        for (const [k, clip] of Object.entries(clips)) {
          const a = mixer.clipAction(clip);
          a.enabled = true;
          actions[k] = a;
        }
        for (const t of clipTracks(actions)) void t;

        let current = null;
        function play(name) {
          const next = actions[name];
          if (!next || current === name) return;
          const prev = actions[current];
          next.reset().setEffectiveWeight(1).setEffectiveTimeScale(1).fadeIn(0.25).play();
          if (prev && prev !== next) prev.fadeOut(0.25);
          current = name;
        }

        const order = ['idle', 'walk', 'run'].filter((k) => actions[k]);
        play(actions.run ? 'run' : order[0]);

        addEventListener('keydown', (e) => {
          const pick = { Digit1: 'idle', Digit2: 'walk', Digit3: 'run' }[e.code];
          if (pick && actions[pick]) play(pick);
        });

        function label() {
          return (
            `<b>${current}</b>  (${clips[current].duration.toFixed(2)}s)\n` +
            `<s>1</s> idle   <s>2</s> walk   <s>3</s> run\n` +
            `bones ${countBones(model)}   tris ${countTris(model)}`
          );
        }

        let angle = 0.6;
        const clock = new THREE.Clock();
        renderer.setAnimationLoop(() => {
          const dt = Math.min(clock.getDelta(), 0.1);
          mixer.update(dt);
          angle += dt * 0.32;
          const r = 3.5;
          camera.position.set(Math.sin(angle) * r, 1.5, Math.cos(angle) * r);
          camera.lookAt(0, 1.02, 0);
          key.target.position.set(0, 1, 0);
          hud.innerHTML = label();
          renderer.render(scene, camera);
        });
      }

      function clipTracks() {
        return [];
      }
      function countBones(root) {
        let n = 0;
        root.traverse((o) => {
          if (o.isBone) n++;
        });
        return n;
      }
      function countTris(root) {
        let n = 0;
        root.traverse((o) => {
          if (o.isMesh && o.geometry) {
            const g = o.geometry;
            n += (g.index ? g.index.count : g.attributes.position.count) / 3;
          }
        });
        return Math.round(n);
      }

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      boot().catch((err) => {
        hud.textContent = 'ERROR ' + err.message;
        console.error(err);
      });
    </script>
  </body>
</html>
